services:
  qdrant:
    image: qdrant/qdrant:v1.14.1
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped

    depends_on:
      qdrant:
        condition: service_healthy

    ports:
      - "8000:8000"

    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333

      REPOSITORIES_ROOT: /repositories
      DATABASE_PATH: /data/repomind.db

      # Ollama
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}

      # Gemini remains optional
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}

      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-1024}

      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}

      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:5173}

      # Upload limits
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-209715200}
      MAX_EXTRACTED_BYTES: ${MAX_EXTRACTED_BYTES:-1073741824}
      MAX_ARCHIVE_ENTRIES: ${MAX_ARCHIVE_ENTRIES:-100000}

      LOG_LEVEL: ${LOG_LEVEL:-INFO}

    volumes:
      # IMPORTANT: writable. Browser uploads need to be stored here.
      - repomind-repositories:/repositories

      - repomind-data:/data
      - model-cache:/models

volumes:
  qdrant-data:
  repomind-data:
  repomind-repositories:
  model-cache: